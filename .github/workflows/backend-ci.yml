name: backend-ci

on:
  push:
    branches: ["agent/**", "project-migration"]
  pull_request:
    branches: ["agent/**", "project-migration"]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "7.0.x"

      - name: Restore
        run: dotnet restore NextAlpha.sln

      - name: Build
        run: dotnet build NextAlpha.sln --no-restore -c Release

      - name: Test
        run: dotnet test NextAlpha.sln --no-build -c Release --logger "trx;LogFileName=results.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
